{% extends 'base/base.html' %}

{% load static %}

{% block title %}
Orders
{% endblock %}

{% block content %}

<div class="ui container">

    <h1 class="ui header">

        Order Management

    </h1>

    <!-- ===================================== -->
    <!-- FILTER BAR -->
    <!-- ===================================== -->

    <div class="ui stackable grid">

        <div class="eight wide column">

            <div class="ui icon input fluid">

                <input

                    id="order-search"

                    type="text"

                    placeholder="
                        Search customer,
                        phone or order id...
                    "

                >

                <i class="search icon"></i>

            </div>

        </div>

        <div class="eight wide column">

            <select

                id="status-filter"

                class="ui dropdown"

            >

                <option value="">
                    All Orders
                </option>

                <option value="pending">
                    Pending
                </option>

                <option value="confirmed">
                    Confirmed
                </option>

                <option value="processing">
                    Processing
                </option>

                <option value="delivered">
                    Delivered
                </option>

                <option value="cancelled">
                    Cancelled
                </option>

            </select>

        </div>

    </div>

    <br>

    <!-- ===================================== -->
    <!-- ORDERS TABLE -->
    <!-- ===================================== -->

    <table
        class="
            ui celled
            striped
            table
        "
    >

        <thead>

            <tr>

                <th>ID</th>

                <th>Customer</th>

                <th>Phone</th>

                <th>Total</th>

                <th>Status</th>

                <th>Date</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody id="orders-table-body">

        </tbody>

    </table>

    <!--
==================================================
ORDER PREVIEW MODAL
==================================================
-->

    <div
        id="order-preview-modal"
        class="custom-modal"
        style="display:none;"
    >

        <div class="custom-modal-content">

            <button
                onclick="
                    document
                    .getElementById(
                        'order-preview-modal'
                    )
                    .style.display='none'
                "
                class="ui red button"
            >

                Close

            </button>

            <h3>

                Order Preview

            </h3>

            <div
                id="order-preview-content"
            >

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}

<script
    src="{% static 'js/admin_orders.js' %}">
</script>

<script>

    loadOrders();

</script>

{% endblock %}
