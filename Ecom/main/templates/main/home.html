{% extends 'base/base.html' %}

{% block title %}
Home
{% endblock %}

{% block content %}

<!-- Hero Banner -->

<!-- ================================================= -->
<!-- Hero Banner Slider -->
<!-- ================================================= -->

<section class="hero-section">

    <div class="ui container">

        <div

            class="hero-slider"

            v-if="banners.length"

        >

            <!-- Current Banner -->

            <div

                class="hero-banner"

            >

                <img

                    :src="

                        banners[currentBanner].image

                    "

                    :alt="

                        banners[currentBanner].title

                    "

                >

                <div class="hero-content">

                    <h1>

                        [[

                            banners[currentBanner].title

                        ]]

                    </h1>

                    <p>

                        [[

                            banners[currentBanner].subtitle

                        ]]

                    </p>

<!--                    <a-->

<!--                        v-if="-->

<!--                            banners[currentBanner].button_text-->

<!--                        "-->

<!--                        :href="-->

<!--                            banners[currentBanner].button_url-->

<!--                        "-->

<!--                        class="ui huge primary button"-->

<!--                        :target="-->

<!--                            banners[currentBanner].open_in_new_tab-->

<!--                            ?-->

<!--                            '_blank'-->

<!--                            :-->

<!--                            '_self'-->

<!--                        "-->

<!--                    >-->

<!--                        [[-->

<!--                            banners[currentBanner].button_text-->

<!--                        ]]-->

<!--                    </a>-->

                </div>

            </div>

            <!-- Previous -->

            <button

                class="banner-prev"

                @click="previousBanner"

            >

                ❮

            </button>

            <!-- Next -->

            <button

                class="banner-next"

                @click="nextBanner"

            >

                ❯

            </button>

            <!-- Dots -->

            <div

                class="banner-dots"

            >

                <span

                    v-for="

                        (

                            banner,

                            index

                        )

                        in banners

                    "

                    :key="banner.id"

                    class="banner-dot"

                    :class="{

                        active:

                        currentBanner===index

                    }"

                    @click="

                        goToBanner(

                            index

                        )

                    "

                >

                </span>

            </div>

        </div>

    </div>

</section>

<!-- ================================================= -->
<!-- Products -->
<!-- ================================================= -->

<section class="featured-section">

    <div class="ui container">

        <h2 class="ui header">

            Products

        </h2>

        <div class="products-grid">

            <div

                class="product-card"

                v-for="product in products"

                :key="product.id"

            >

                <!-- Product Image -->

                <a

                    class="product-image"

                    :href="'/product/' + product.slug + '/'"

                >

                    <img

                        :src="product.main_image"

                        :alt="product.name"

                    >

                </a>

                <!-- Product Information -->

                <div class="product-body">

                    <div class="product-title">

                        [[ product.name ]]

                    </div>

                    <div class="product-category">

                        [[ product.category_name ]]

                    </div>

                    <div class="product-price">

                        ৳ [[ product.price ]]

                    </div>

                </div>

                <!-- Footer -->

                <div class="product-footer">

                    <button

                        class="ui fluid primary button"

                        @click="addProductToCart(product)"

                    >

                        <i class="shopping cart icon"></i>

                        Add To Cart

                    </button>

                </div>

            </div>

        </div>

        <div

            v-if="products.length===0"

            class="ui warning message"

        >

            No products found.

        </div>

    </div>

</section>

{% endblock %}
